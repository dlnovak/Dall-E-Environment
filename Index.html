  "clean-utopian": "in a clean utopian city style with bright ordered streets, green integration and a peaceful atmosphere",
  "coastal-resort": "in a coastal resort town style with pastel buildings, palm trees and a relaxed waterfront atmosphere",
  "east-asian": "in an East Asian urban style with dense layered signage, lanterns and neon interleaved with traditional architecture",

const COLOR_PROMPTS = {
  "warm-neutrals": "a warm neutral color palette of creams, tans and soft browns",
  "cool-grays": "a cool gray and blue color palette of slate, silver and cool white tones",
  "earth-tones": "an earth-tone color palette of terracotta, olive green, rust and clay",
  "crisp-white": "a crisp white and bright color palette with white surfaces and light airy tones",
  "dark-moody": "a dark and moody color palette of charcoal, deep navy and forest green",
  "bold-saturated": "a bold saturated color palette with high contrast and strong vibrant choices",
  "pastel-soft": "a soft pastel color palette of muted pinks, sage green and lavender",
  "monochromatic": "a monochromatic color palette with one dominant color in varying tones",
  "natural-greens": "a natural green color palette inspired by plants, wood tones and stone",
  "black-white": "a desaturated black and white color palette, timeless and graphic",
  "jewel-tones": "a jewel-tone color palette of deep sapphire, emerald, amber and ruby",
  "sun-bleached": "a sun-bleached color palette of faded washed-out coastal and aged tones",
};

function buildPrompt(state) {
  if (!state.scene) return "";
  const sceneType = getSceneType(state.scene);
  const parts = ["A scene of " + getSceneLabel(state.scene).toLowerCase()];
  if (state.designStyle && DS_PROMPTS[state.designStyle]) parts.push(DS_PROMPTS[state.designStyle]);
  if (state.colorPalette && COLOR_PROMPTS[state.colorPalette]) parts.push("with " + COLOR_PROMPTS[state.colorPalette]);
  if (state.elements && state.elements.length) {
    const allEls = SCENE_ELEMENTS[sceneType] || [];
    const labels = state.elements.map((id) => allEls.find((e) => e.id === id)).filter(Boolean).map((e) => e.label.toLowerCase());
    if (labels.length) parts.push("the scene includes " + labels.join(", "));
  }
  const vstyle = { "photorealistic": "photographed in a highly photorealistic style, sharp and true-to-life", "cinematic-moody": "rendered in a cinematic style with dramatic lighting, deep shadows and subtle film grain", "soft-dreamy": "with a soft dreamy quality, gentle diffusion, glowy edges, warm and hazy atmosphere", "hallucinated": "with a slightly surreal hallucinated quality, hyper-saturated colors, uncanny perfection", "hdr-punchy": "in an HDR photography style with punchy contrast, vivid saturation, everything crisp", "warm-film": "shot on analog film with warm golden tones, natural grain and soft imperfections", "flat-editorial": "in a flat editorial style with even controlled lighting, muted palette, magazine-clean", "painterly-real": "in a painterly realism style with oil painting texture meeting photographic accuracy" };
  if (state.style) parts.push(vstyle[state.style] || "");
  const cam = { "real-estate-wide": "shot with a corrected wide-angle lens, minimal distortion, full coverage", "editorial-straight": "composed as a straight-on editorial shot, centered and flat", "corner-perspective": "photographed from a corner angle showing two walls and full depth", "eye-level-natural": "captured at natural standing eye level as if you are physically present", "aerial-drone": "photographed from an aerial drone perspective looking down at an angle", "street-level": "shot at low street level with a wide grounded perspective" };
  if (state.camera) parts.push(cam[state.camera] || "");
  const t = TIME_OF_DAY.find((x) => x.id === state.time);
  const l = LIGHTING.find((x) => x.id === state.lighting);
  if (t && l) parts.push(t.label.toLowerCase() + " with " + l.label.toLowerCase() + " quality lighting");
  const sn = SEASON.find((x) => x.id === state.season);
  if (sn && sn.id !== "none") parts.push(sn.label.toLowerCase() + " season");
  const det = { "minimal-clean": "the space is minimal and uncluttered with clean intentional simplicity", "styled-lived": "the space feels lived-in and styled with personal touches", "layered-rich": "the space is rich with layered detail, textures and objects" };
  if (state.detail) parts.push(det[state.detail] || "");
  const r = ASPECT_RATIOS.find((x) => x.id === state.ratio);
  if (r) parts.push("compose for a " + r.id + " (" + r.desc + ") aspect ratio");
  parts.push("ultra high resolution, no watermarks, no people");
  return parts.join(". ") + ".";
}

const TYPE_LABELS = { "interior-room": "Interior Room", "interior-space": "Interior Space", "exterior-home": "Exterior / Home", "cityscape": "Cityscape", "nature": "Nature" };

function RadioCard({ label, desc, selected, onClick }) {
  return (
    <button onClick={onClick} style={{ background: selected ? "rgba(255,196,87,0.09)" : "rgba(255,255,255,0.025)", border: selected ? "1px solid rgba(255,196,87,0.6)" : "1px solid rgba(255,255,255,0.07)", borderRadius: "7px", padding: desc ? "10px 12px" : "8px 12px", cursor: "pointer", textAlign: "left", width: "100%" }}>
      <div style={{ color: selected ? "#FFC457" : "#D0C8BC", fontFamily: "DM Sans, sans-serif", fontSize: "12.5px", fontWeight: selected ? 600 : 400 }}>{label}</div>
      {desc && <div style={{ color: "rgba(232,224,208,0.35)", fontFamily: "DM Sans, sans-serif", fontSize: "10.5px", marginTop: "3px", lineHeight: "1.4" }}>{desc}</div>}
    </button>
  );
}

function ToggleChip({ label, selected, onClick }) {
  return (
    <button onClick={onClick} style={{ background: selected ? "rgba(255,196,87,0.11)" : "rgba(255,255,255,0.03)", border: selected ? "1px solid rgba(255,196,87,0.55)" : "1px solid rgba(255,255,255,0.08)", borderRadius: "18px", padding: "5px 11px", cursor: "pointer", color: selected ? "#FFC457" : "rgba(232,224,208,0.55)", fontFamily: "DM Sans, sans-serif", fontSize: "11.5px", fontWeight: selected ? 600 : 400, whiteSpace: "nowrap" }}>{label}</button>
  );
}

function ColorSwatch({ palette, selected, onClick }) {
  return (
    <button onClick={onClick} style={{ background: selected ? "rgba(255,196,87,0.07)" : "rgba(255,255,255,0.02)", border: selected ? "1px solid rgba(255,196,87,0.55)" : "1px solid rgba(255,255,255,0.07)", borderRadius: "7px", padding: "8px 10px", cursor: "pointer", textAlign: "left", display: "flex", alignItems: "center", gap: "8px", width: "100%" }}>
      <div style={{ width: "14px", height: "14px", borderRadius: "50%", background: palette.swatch, flexShrink: 0, border: "1px solid rgba(255,255,255,0.12)" }} />
      <div>
        <div style={{ color: selected ? "#FFC457" : "#D0C8BC", fontFamily: "DM Sans, sans-serif", fontSize: "12px", fontWeight: selected ? 600 : 400 }}>{palette.label}</div>
        <div style={{ color: "rgba(232,224,208,0.3)", fontFamily: "DM Sans, sans-serif", fontSize: "10px" }}>{palette.desc}</div>
      </div>
    </button>
  );
}

function ListPicker({ items, value, onChange }) {
  return (
    <div>
      {items.map((item) => (
        <button key={item.id} onClick={() => onChange(item.id)} style={{ background: "none", border: "none", borderLeft: value === item.id ? "2px solid #FFC457" : "2px solid transparent", cursor: "pointer", textAlign: "left", padding: "5px 8px", display: "block", width: "100%", color: value === item.id ? "#FFC457" : "rgba(232,224,208,0.52)", fontFamily: "DM Sans, sans-serif", fontSize: "12.5px", fontWeight: value === item.id ? 600 : 400 }}>
          {item.label}
        </button>
      ))}
    </div>
  );
}

function SectionTitle({ step, title, subtitle }) {
  return (
    <div style={{ marginBottom: "13px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: "9px" }}>
        <span style={{ background: "rgba(255,196,87,0.14)", border: "1px solid rgba(255,196,87,0.38)", color: "#FFC457", borderRadius: "50%", width: "21px", height: "21px", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "10px", fontWeight: 700, fontFamily: "DM Mono, monospace", flexShrink: 0 }}>{step}</span>
        <span style={{ color: "#E8E0D0", fontFamily: "DM Sans, sans-serif", fontSize: "13.5px", fontWeight: 600 }}>{title}</span>
      </div>
      {subtitle && <div style={{ color: "rgba(232,224,208,0.36)", fontFamily: "DM Sans, sans-serif", fontSize: "11px", marginTop: "3px", marginLeft: "30px" }}>{subtitle}</div>}
    </div>
  );
}

function App() {
  const [state, setState] = useState({ scene: null, designStyle: null, colorPalette: null, elements: [], style: "photorealistic", camera: "real-estate-wide", ratio: "16:9", time: "golden-hour", lighting: "warm-cozy", detail: "styled-lived", season: "none" });

              )}
            </div>

          </div>
        </main>
      </div>
    </div>
  );
}
